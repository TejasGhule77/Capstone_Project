version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriintel_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEMO_MODE=true
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - DATABASE_URL=sqlite:////app/data/agriintel.db
      - OCR_PROVIDER=tesseract
      - ENABLE_INVENTORY_BLOCKCHAIN=true
    volumes:
      - ./data:/app/data
      - ./backend/uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

